<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    #appHeading {
      margin: 0 0 24px;
      font-size: 28px;
      font-weight: 700;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    #taskInput {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1222;
      color: var(--text);
      font-size: 15px;
    }
    #taskInput:focus { outline: 2px solid var(--accent); }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    #addBtn {
      background: var(--accent);
      color: white;
      padding: 12px 18px;
    }
    #addBtn:hover { background: var(--accent-hover); }
    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: #0b1222;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .task-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }
    .actions { display: flex; gap: 6px; }
    .done-btn {
      background: var(--success);
      color: white;
    }
    .delete-btn {
      background: var(--danger);
      color: white;
    }
    .delete-btn:hover { background: var(--danger-hover); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="appHeading">Task Manager</h1>

    <div class="form-row">
      <input type="text" id="taskInput" placeholder="Enter a new task..." autocomplete="off" />
      <button id="addBtn" type="button">Add</button>
    </div>

    <ul id="taskList" aria-label="Task list"></ul>
  </div>

  <script>
    const API = '/api/tasks';
    const list = document.getElementById('taskList');
    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function fetchTasks() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Fetch failed');
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (e) {
        renderTasks([]);
      }
    }

    function renderTasks(tasks) {
      list.innerHTML = '';
      if (!tasks || tasks.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'No tasks yet.';
        list.appendChild(empty);
        return;
      }
      tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = 'task-item' + (t.done ? ' done' : '');
        li.dataset.id = t.id;
        li.innerHTML = `
          <span class="task-text">${escapeHtml(t.text)}</span>
          <div class="actions">
            <button type="button" class="done-btn">Done</button>
            <button type="button" class="delete-btn">Delete</button>
          </div>
        `;
        li.querySelector('.done-btn').addEventListener('click', () => toggleDone(t.id));
        li.querySelector('.delete-btn').addEventListener('click', () => deleteTask(t.id));
        list.appendChild(li);
      });
    }

    async function addTask() {
      const text = input.value.trim();
      if (!text) return; // empty rejection (test 11)
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        if (!res.ok) throw new Error('Add failed');
        input.value = '';
        await fetchTasks();
      } catch (e) {
        console.error(e);
      }
    }

    async function toggleDone(id) {
      try {
        await fetch(`${API}/${id}/toggle`, { method: 'PUT' });
        await fetchTasks();
      } catch (e) { console.error(e); }
    }

    async function deleteTask(id) {
      try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        await fetchTasks();
      } catch (e) { console.error(e); }
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    fetchTasks();
  </script>
</body>
</html>
